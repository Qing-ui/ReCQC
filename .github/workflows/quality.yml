name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install test and quality dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository structure and source syntax
        run: python -m unittest discover -s tests -v
      - name: Run static checks
        run: ruff check apps ReCQC2.0-speed tests
      - name: Check formatting
        run: ruff format --check apps ReCQC2.0-speed tests
